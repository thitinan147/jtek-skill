<text x="647" y="228" font-size="12" text-anchor="middle" fill="#111111">red CI</text>
<rect x="683.1999999999999" y="210" width="108" height="28" rx="14" fill="none" stroke="#d0d7de" stroke-width="1.2"/>
<text x="737" y="228" font-size="12" text-anchor="middle" fill="#111111">a second claim</text>
</g></svg>

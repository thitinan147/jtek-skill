<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268" role="img" aria-label="jtek flow: you set a ticket to Todo in Notion, one session builds it in its own worktree and passes the checks, a second session that did not write it gives a verdict, a pull request opens with evidence, and you merge. jtek.py refuses a red base, a failing check, evidence that skips an item, a verdict for older code, red CI, and a second claim.">
<rect width="880" height="268" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<text x="22" y="36" font-size="15" font-weight="600" fill="#111111">One ticket in. One pull request out. You merge.</text>
<rect x="22" y="64" width="148" height="86" rx="8" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<text x="96.0" y="94" font-size="15" font-weight="600" text-anchor="middle" fill="#ffffff">You</text>
<text x="96.0" y="116" font-size="12" text-anchor="middle" fill="#ffffff">write the ticket,</text>
<text x="96.0" y="132" font-size="12" text-anchor="middle" fill="#ffffff">set Todo in Notion</text>
<path d="M174 107.0H188" stroke="#111111" stroke-width="1.5"/>
<path d="M187 102.0L194 107.0L187 112.0z" fill="#111111"/>

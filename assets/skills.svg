<rect x="10" y="312" width="860" height="124" rx="10" fill="#f6f8fa"/>
<text x="22" y="334" font-size="11.5" font-weight="600" fill="#111111">FOUR MORE, WHEN SOMETHING HAPPENS</text>
<rect x="22.0" y="346" width="197.0" height="74" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="120.5" y="370.0" font-size="14" font-weight="600" text-anchor="middle" fill="#111111">jt-debug</text>
<text x="120.5" y="391.0" font-size="11.5" text-anchor="middle" fill="#57606a">a check fails: find the</text>
<text x="120.5" y="407.0" font-size="11.5" text-anchor="middle" fill="#57606a">cause before any edit</text>
<rect x="235.0" y="346" width="197.0" height="74" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="333.5" y="370.0" font-size="14" font-weight="600" text-anchor="middle" fill="#111111">jt-babysit</text>
<text x="333.5" y="391.0" font-size="11.5" text-anchor="middle" fill="#57606a">the pull request has</text>
<text x="333.5" y="407.0" font-size="11.5" text-anchor="middle" fill="#57606a">conflicts, red CI, comments</text>
<rect x="448.0" y="346" width="197.0" height="74" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="546.5" y="370.0" font-size="14" font-weight="600" text-anchor="middle" fill="#111111">jt-learn</text>
<text x="546.5" y="391.0" font-size="11.5" text-anchor="middle" fill="#57606a">you corrected the agent:</text>
<text x="546.5" y="407.0" font-size="11.5" text-anchor="middle" fill="#57606a">turn it into a check</text>
<rect x="661.0" y="346" width="197.0" height="74" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="759.5" y="370.0" font-size="14" font-weight="600" text-anchor="middle" fill="#111111">jt-harness</text>
<text x="759.5" y="391.0" font-size="11.5" text-anchor="middle" fill="#57606a">once per repository: build</text>
<text x="759.5" y="407.0" font-size="11.5" text-anchor="middle" fill="#57606a">the way to run the real app</text>

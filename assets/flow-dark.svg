<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268" role="img" aria-label="jtek flow: you set a ticket to Todo on the board, one session builds it in its own worktree and passes the checks, a second session that did not write it gives a verdict, a pull request opens with evidence, and you merge. jtek.py refuses a red base, a failing check, evidence that skips an item, a verdict for older code, red CI, and a second claim.">
<rect width="880" height="268" fill="#0d1117"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<text x="22" y="36" font-size="15" font-weight="600" fill="#e6edf3">One ticket in. One pull request out. You merge.</text>
<rect x="22" y="64" width="148" height="86" rx="8" fill="#e6edf3" stroke="#e6edf3" stroke-width="1.5"/>
<text x="96.0" y="94" font-size="15" font-weight="600" text-anchor="middle" fill="#0d1117">You</text>
<text x="96.0" y="116" font-size="12" text-anchor="middle" fill="#0d1117">write the ticket,</text>
<text x="96.0" y="132" font-size="12" text-anchor="middle" fill="#0d1117">set it to Todo</text>
<path d="M174 107.0H188" stroke="#e6edf3" stroke-width="1.5"/>
<path d="M187 102.0L194 107.0L187 112.0z" fill="#e6edf3"/>
<rect x="196" y="64" width="148" height="86" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="270.0" y="94" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3">Session 1</text>
<text x="270.0" y="116" font-size="12" text-anchor="middle" fill="#9198a1">own worktree: build,</text>
<text x="270.0" y="132" font-size="12" text-anchor="middle" fill="#9198a1">checks, see it work</text>
<path d="M348 107.0H362" stroke="#e6edf3" stroke-width="1.5"/>
<path d="M361 102.0L368 107.0L361 112.0z" fill="#e6edf3"/>
<rect x="370" y="64" width="148" height="86" rx="8" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
<text x="444.0" y="94" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3">Session 2</text>
<text x="444.0" y="116" font-size="12" text-anchor="middle" fill="#9198a1">did not write it:</text>
<text x="444.0" y="132" font-size="12" text-anchor="middle" fill="#9198a1">tries to break it</text>
<path d="M522 107.0H536" stroke="#e6edf3" stroke-width="1.5"/>
<path d="M535 102.0L542 107.0L535 112.0z" fill="#e6edf3"/>
<rect x="544" y="64" width="148" height="86" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="618.0" y="94" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3">Pull request</text>
<text x="618.0" y="116" font-size="12" text-anchor="middle" fill="#9198a1">with evidence for</text>
<text x="618.0" y="132" font-size="12" text-anchor="middle" fill="#9198a1">every Done-when item</text>
<path d="M696 107.0H710" stroke="#e6edf3" stroke-width="1.5"/>
<path d="M709 102.0L716 107.0L709 112.0z" fill="#e6edf3"/>
<rect x="718" y="64" width="148" height="86" rx="8" fill="#e6edf3" stroke="#e6edf3" stroke-width="1.5"/>
<text x="792.0" y="94" font-size="15" font-weight="600" text-anchor="middle" fill="#0d1117">You</text>
<text x="792.0" y="116" font-size="12" text-anchor="middle" fill="#0d1117">read the evidence,</text>
<text x="792.0" y="132" font-size="12" text-anchor="middle" fill="#0d1117">merge</text>
<text x="22" y="196" font-size="12" font-weight="600" fill="#d29922" letter-spacing="0.5">JTEK.PY REFUSES</text>
<rect x="22" y="210" width="82" height="28" rx="14" fill="none" stroke="#3d444d" stroke-width="1.2"/>
<text x="63" y="228" font-size="12" text-anchor="middle" fill="#e6edf3">a red base</text>
<rect x="112.0" y="210" width="115" height="28" rx="14" fill="none" stroke="#3d444d" stroke-width="1.2"/>
<text x="170" y="228" font-size="12" text-anchor="middle" fill="#e6edf3">a failing check</text>
<rect x="235.0" y="210" width="194" height="28" rx="14" fill="none" stroke="#3d444d" stroke-width="1.2"/>
<text x="332" y="228" font-size="12" text-anchor="middle" fill="#e6edf3">evidence that skips an item</text>
<rect x="437.2" y="210" width="174" height="28" rx="14" fill="none" stroke="#3d444d" stroke-width="1.2"/>
<text x="524" y="228" font-size="12" text-anchor="middle" fill="#e6edf3">a verdict for older code</text>
<rect x="619.5999999999999" y="210" width="56" height="28" rx="14" fill="none" stroke="#3d444d" stroke-width="1.2"/>
<text x="647" y="228" font-size="12" text-anchor="middle" fill="#e6edf3">red CI</text>
<rect x="683.1999999999999" y="210" width="108" height="28" rx="14" fill="none" stroke="#3d444d" stroke-width="1.2"/>
<text x="737" y="228" font-size="12" text-anchor="middle" fill="#e6edf3">a second claim</text>
</g></svg>

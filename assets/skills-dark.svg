<path d="M119.2 244.0L126.2 249.0L119.2 254.0z" fill="#e6edf3"/>
<path d="M224.4 249.0H226.4" stroke="#e6edf3" stroke-width="1.5"/>
<path d="M225.4 244.0L232.4 249.0L225.4 254.0z" fill="#e6edf3"/>
<path d="M330.8 249.0H332.8" stroke="#e6edf3" stroke-width="1.5"/>
<path d="M331.8 244.0L338.8 249.0L331.8 254.0z" fill="#e6edf3"/>
<path d="M437.1 249.0H439.1" stroke="#e6edf3" stroke-width="1.5"/>
<path d="M438.1 244.0L445.1 249.0L438.1 254.0z" fill="#e6edf3"/>
<path d="M543.2 249.0H545.2" stroke="#e6edf3" stroke-width="1.5"/>
<path d="M544.2 244.0L551.2 249.0L544.2 254.0z" fill="#e6edf3"/>
<path d="M649.5 249.0H651.5" stroke="#e6edf3" stroke-width="1.5"/>
<path d="M650.5 244.0L657.5 249.0L650.5 254.0z" fill="#e6edf3"/>
<path d="M755.8 249.0H757.8" stroke="#e6edf3" stroke-width="1.5"/>
<path d="M756.8 244.0L763.8 249.0L756.8 254.0z" fill="#e6edf3"/>
<rect x="10" y="312" width="860" height="124" rx="10" fill="#151b23"/>
<text x="22" y="334" font-size="11.5" font-weight="600" fill="#e6edf3">FOUR MORE, WHEN SOMETHING HAPPENS</text>
<rect x="22.0" y="346" width="197.0" height="74" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="120.5" y="370.0" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">jt-debug</text>
<text x="120.5" y="391.0" font-size="11.5" text-anchor="middle" fill="#9198a1">a check fails: find the</text>
<text x="120.5" y="407.0" font-size="11.5" text-anchor="middle" fill="#9198a1">cause before any edit</text>
<rect x="235.0" y="346" width="197.0" height="74" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="333.5" y="370.0" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">jt-babysit</text>
<text x="333.5" y="391.0" font-size="11.5" text-anchor="middle" fill="#9198a1">the pull request has</text>
<text x="333.5" y="407.0" font-size="11.5" text-anchor="middle" fill="#9198a1">conflicts, red CI, comments</text>
<rect x="448.0" y="346" width="197.0" height="74" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="546.5" y="370.0" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">jt-learn</text>
<text x="546.5" y="391.0" font-size="11.5" text-anchor="middle" fill="#9198a1">you corrected the agent:</text>
<text x="546.5" y="407.0" font-size="11.5" text-anchor="middle" fill="#9198a1">turn it into a check</text>
<rect x="661.0" y="346" width="197.0" height="74" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="759.5" y="370.0" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">jt-harness</text>
<text x="759.5" y="391.0" font-size="11.5" text-anchor="middle" fill="#9198a1">once per repository: build</text>
<text x="759.5" y="407.0" font-size="11.5" text-anchor="middle" fill="#9198a1">the way to run the real app</text>
</g>
</svg>

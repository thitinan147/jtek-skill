<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 446" width="880" height="446" role="img" aria-label="What you type, and what runs. Four modes load only when you type them: /jt for any task with a ticket or without, /jt-ticket to turn what you want into tickets, /jt-me for your report style, and /jt-agents for your list of reviewers. One ticket, with /jt-work, runs eight steps in order: start, understand, build, check, verify, clean up, ship, and review; start and check belong to jt-work itself, and the other six are skills of their own; check and verify run something real, and review is a second session. Four skills answer an event: jt-debug when a check fails, jt-babysit when the pull request needs work, jt-learn after you correct the agent, and jt-harness once per repository.">
<rect width="880" height="446" fill="#0d1117"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<text x="22" y="36" font-size="15" font-weight="600" fill="#e6edf3">What you type, and what runs</text>
<rect x="10" y="52" width="860" height="112" rx="10" fill="#151b23"/>
<text x="22" y="74" font-size="11.5" font-weight="600" fill="#e6edf3">FOUR MODES</text>
<text x="104" y="74" font-size="11.5" fill="#9198a1">loaded only when you type them</text>
<rect x="22.0" y="86" width="197.0" height="66" rx="8" fill="#e6edf3" stroke="#e6edf3" stroke-width="1.5"/>
<text x="120.5" y="106.0" font-size="14" font-weight="600" text-anchor="middle" fill="#0d1117">/jt</text>
<text x="120.5" y="127.0" font-size="11.5" text-anchor="middle" fill="#0d1117">any task, with a ticket</text>
<text x="120.5" y="143.0" font-size="11.5" text-anchor="middle" fill="#0d1117">or without one</text>
<rect x="235.0" y="86" width="197.0" height="66" rx="8" fill="#e6edf3" stroke="#e6edf3" stroke-width="1.5"/>
<text x="333.5" y="106.0" font-size="14" font-weight="600" text-anchor="middle" fill="#0d1117">/jt-ticket</text>
<text x="333.5" y="127.0" font-size="11.5" text-anchor="middle" fill="#0d1117">turns what you want</text>
<text x="333.5" y="143.0" font-size="11.5" text-anchor="middle" fill="#0d1117">into tickets</text>
<rect x="448.0" y="86" width="197.0" height="66" rx="8" fill="#e6edf3" stroke="#e6edf3" stroke-width="1.5"/>
<text x="546.5" y="106.0" font-size="14" font-weight="600" text-anchor="middle" fill="#0d1117">/jt-me</text>
<text x="546.5" y="127.0" font-size="11.5" text-anchor="middle" fill="#0d1117">keeps your</text>
<text x="546.5" y="143.0" font-size="11.5" text-anchor="middle" fill="#0d1117">report style</text>
<rect x="661.0" y="86" width="197.0" height="66" rx="8" fill="#e6edf3" stroke="#e6edf3" stroke-width="1.5"/>
<text x="759.5" y="106.0" font-size="14" font-weight="600" text-anchor="middle" fill="#0d1117">/jt-agents</text>
<text x="759.5" y="127.0" font-size="11.5" text-anchor="middle" fill="#0d1117">keeps your list</text>
<text x="759.5" y="143.0" font-size="11.5" text-anchor="middle" fill="#0d1117">of reviewers</text>
<rect x="10" y="176" width="860" height="124" rx="10" fill="#151b23"/>
<path d="M68 153V207" stroke="#e6edf3" stroke-width="1.5"/>
<path d="M63 206L68 213L73 206z" fill="#e6edf3"/>
<text x="80" y="198" font-size="11.5" fill="#9198a1">ticket work goes to jt-work</text>
<text x="330" y="198" font-size="11.5" font-weight="600" fill="#e6edf3">ONE TICKET</text>
<text x="410" y="198" font-size="11.5" fill="#9198a1">/jt-work T-12 keeps this order; start and check are its own</text>
<rect x="22.0" y="214" width="92.2" height="70" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="68.1" y="235.5" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">start</text>
<text x="68.1" y="256.5" font-size="11.5" text-anchor="middle" fill="#9198a1">claim it,</text>
<text x="68.1" y="272.5" font-size="11.5" text-anchor="middle" fill="#9198a1">new worktree</text>
<rect x="128.2" y="214" width="92.2" height="70" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="174.29999999999998" y="235.5" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">understand</text>
<text x="174.29999999999998" y="256.5" font-size="11.5" text-anchor="middle" fill="#9198a1">name the</text>
<text x="174.29999999999998" y="272.5" font-size="11.5" text-anchor="middle" fill="#9198a1">proof</text>
<rect x="234.5" y="214" width="92.2" height="70" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="280.6" y="235.5" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">build</text>
<text x="280.6" y="256.5" font-size="11.5" text-anchor="middle" fill="#9198a1">small change</text>
<text x="280.6" y="272.5" font-size="11.5" text-anchor="middle" fill="#9198a1">with tests</text>
<rect x="340.8" y="214" width="92.2" height="70" rx="8" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
<text x="386.90000000000003" y="235.5" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">check</text>
<text x="386.90000000000003" y="256.5" font-size="11.5" text-anchor="middle" fill="#9198a1">your checks</text>
<text x="386.90000000000003" y="272.5" font-size="11.5" text-anchor="middle" fill="#9198a1">must pass</text>
<rect x="447.0" y="214" width="92.2" height="70" rx="8" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
<text x="493.1" y="235.5" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">verify</text>
<text x="493.1" y="256.5" font-size="11.5" text-anchor="middle" fill="#9198a1">run the real</text>
<text x="493.1" y="272.5" font-size="11.5" text-anchor="middle" fill="#9198a1">app and look</text>
<rect x="553.2" y="214" width="92.2" height="70" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="599.3000000000001" y="235.5" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">clean up</text>
<text x="599.3000000000001" y="256.5" font-size="11.5" text-anchor="middle" fill="#9198a1">remove</text>
<text x="599.3000000000001" y="272.5" font-size="11.5" text-anchor="middle" fill="#9198a1">leftovers</text>
<rect x="659.5" y="214" width="92.2" height="70" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="705.6" y="235.5" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">ship</text>
<text x="705.6" y="256.5" font-size="11.5" text-anchor="middle" fill="#9198a1">pull request</text>
<text x="705.6" y="272.5" font-size="11.5" text-anchor="middle" fill="#9198a1">+ evidence</text>
<rect x="765.8" y="214" width="92.2" height="70" rx="8" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
<text x="811.9" y="235.5" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">review</text>
<text x="811.9" y="256.5" font-size="11.5" text-anchor="middle" fill="#9198a1">2nd session</text>
<text x="811.9" y="272.5" font-size="11.5" text-anchor="middle" fill="#9198a1">tests it</text>

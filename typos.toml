[default]
extend-ignore-re = [
    # A line ending in this marker is a fixture that must stay misspelled.
    # The comment on that line says why.
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
]

[default.extend-words]
# Auth path token in the size-escalation regex (signin / signins). Not the noun "signings".
signins = "signins"

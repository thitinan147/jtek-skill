name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: python -m unittest discover -s tests

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: bandit (new shell=True without a reviewed nosec fails)
        run: uvx bandit -r skills -s B404,B603,B607,B105
      - name: Agent Skills spec validation
        run: |
          uvx --from skills-ref agentskills validate skills/jt-work-queue
          # jt-review-work uses disable-model-invocation (Claude Code), which is outside the spec.
          # Validate a copy without that one field so any other problem still fails.
          rm -rf /tmp/spec && mkdir /tmp/spec && cp -R skills/jt-review-work /tmp/spec/jt-review-work
          sed -i '/^disable-model-invocation:/d' /tmp/spec/jt-review-work/SKILL.md
          uvx --from skills-ref agentskills validate /tmp/spec/jt-review-work

  skillspector:
    # Blocks on HIGH/CRITICAL findings; uploads SARIF to the Security tab.
    # One job per skill: GitHub rejects two SARIF runs that share a category.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        skill: [jt-work-queue, jt-review-work]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - run: uv tool install git+https://github.com/NVIDIA/skillspector.git@v2.12.0
      - name: Scan (static, no LLM)
        run: |
          mkdir -p sarif
          skillspector scan "skills/${{ matrix.skill }}" --no-llm --baseline .skillspector-baseline.yaml \
            --format sarif --output "sarif/${{ matrix.skill }}.sarif"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: sarif/${{ matrix.skill }}.sarif
          category: skillspector-${{ matrix.skill }}

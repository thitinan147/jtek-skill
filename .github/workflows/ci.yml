name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: python -m unittest discover -s tests

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - name: bandit (new shell=True without a reviewed nosec fails)
        run: uvx bandit -r skills -s B404,B603,B607,B105
      - name: Agent Skills spec validation
        run: |
          # disable-model-invocation and argument-hint are Claude Code fields outside the spec.
          # Validate a dereferenced copy without them so any other problem still fails.
          rm -rf /tmp/spec && mkdir /tmp/spec
          for skill in skills/*/; do
            name=$(basename "$skill")
            cp -RL "$skill" "/tmp/spec/$name"
            sed -i -e '/^disable-model-invocation:/d' -e '/^argument-hint:/d' "/tmp/spec/$name/SKILL.md"
            uvx --from skills-ref agentskills validate "/tmp/spec/$name"
          done

  skillspector:
    # Blocks on HIGH/CRITICAL findings; uploads SARIF to the Security tab.
    # One job per skill: GitHub rejects two SARIF runs that share a category.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        skill: [jt, jt-agents, jt-babysit, jt-build, jt-cleanup, jt-debug, jt-harness, jt-init, jt-learn, jt-me, jt-review, jt-ship, jt-status, jt-ticket, jt-understand, jt-verify, jt-work]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - run: uv tool install git+https://github.com/NVIDIA/skillspector.git@v2.12.0
      - name: Scan (static, no LLM)
        run: |
          mkdir -p sarif
          skillspector scan "skills/${{ matrix.skill }}" --no-llm \
            --format sarif --output "sarif/${{ matrix.skill }}.sarif"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: sarif/${{ matrix.skill }}.sarif
          category: skillspector-${{ matrix.skill }}
